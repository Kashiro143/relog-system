name: Déployer K-OS sur GitHub Pages

on:
  push:
    branches: [main, master]
    paths: ["kos/**", ".github/workflows/deploy-kos.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kos/package-lock.json
      - run: npm ci
      - name: Build
        # Un dépôt "<pseudo>.github.io" est servi à la racine, les autres sous /<repo>/.
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then export KOS_BASE="/"; else export KOS_BASE="/$REPO/"; fi
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: kos/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
