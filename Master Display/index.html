<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>K-OS // MASTER_DASHBOARD_V5</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300&display=swap');

        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background: transparent; /* Transparent pour OBS */
            overflow: hidden;
            font-family: 'Fira Code', monospace;
        }

        /* --- PANNEAU DE CONTROLE (CACHÉ PAR DÉFAUT) --- */
        #ui-control {
            position: absolute;
            top: 10px; left: 10px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #0FF;
            padding: 10px;
            z-index: 9999;
            opacity: 0.1; /* Très discret */
            transition: opacity 0.3s;
        }
        #ui-control:hover { opacity: 1; } /* S'affiche au survol */

        #ui-control h2 { font-size: 10px; color: #0FF; margin: 0 0 10px 0; letter-spacing: 2px; }

        .toggle-item {
            display: flex;
            align-items: center;
            color: #fff;
            font-size: 10px;
            margin-bottom: 5px;
            cursor: pointer;
        }
        .toggle-item input { margin-right: 10px; }

        /* --- WRAPPERS DES MODULES --- */
        .module-wrapper {
            position: absolute;
            cursor: move;
            transition: opacity 0.5s, transform 0.5s;
            z-index: 10;
        }

        /* Classe pour cacher les modules */
        .hidden {
            opacity: 0 !important;
            pointer-events: none !important;
            transform: scale(0.95);
        }

        iframe {
            border: none; width: 100%; height: 100%;
            pointer-events: none;
            background: transparent;
        }
    </style>
</head>
<body>

    <div id="ui-control">
        <h2>K-OS // MODULE_MANAGER</h2>
        <label class="toggle-item">
            <input type="checkbox" checked onchange="toggleModule('mod-alert', this.checked)"> ALERT_SYSTEM
        </label>
        <label class="toggle-item">
            <input type="checkbox" checked onchange="toggleModule('mod-status', this.checked)"> STATUS_MONITOR
        </label>
        <label class="toggle-item">
            <input type="checkbox" checked onchange="toggleModule('mod-scanner', this.checked)"> DATA_SCANNER
        </label>
        <label class="toggle-item">
            <input type="checkbox" checked onchange="toggleModule('mod-avatar', this.checked)"> NEURAL_AVATAR
        </label>
    </div>

    <div id="mod-alert" class="module-wrapper" style="top: 20%; left: 5%; width: 400px; height: 200px;">
        <iframe src="kos_module_main.html"></iframe>
    </div>

    <div id="mod-status" class="module-wrapper" style="top: 5%; left: 35%; width: 350px; height: 100px;">
        <iframe src="module_status.html"></iframe>
    </div>
    <div id="mod-avatar" class="module-wrapper" style="bottom: 10%; left: 5%; width: 250px; height: 250px;">
        <iframe src="module_avatar.html"></iframe>
    </div>
    <div id="mod-scanner" class="module-wrapper" style="bottom: 5%; right: 5%; width: 250px; height: 150px;">
        <iframe src="module_scanner.html"></iframe>
    </div>

    <script>
        // FONCTION POUR CACHER / AFFICHER
        function toggleModule(id, isChecked) {
            const el = document.getElementById(id);
            if (isChecked) {
                el.classList.remove('hidden');
            } else {
                el.classList.add('hidden');
            }
        }

        // SYSTÈME DE DRAG & DROP
        const wrappers = document.querySelectorAll('.module-wrapper');
        wrappers.forEach(wrapper => {
            let isDragging = false;
            let offset = { x: 0, y: 0 };

            wrapper.addEventListener('mousedown', (e) => {
                if (e.target.tagName === 'INPUT') return; // Ne pas drag si on clique sur une checkbox
                isDragging = true;
                offset.x = e.clientX - wrapper.offsetLeft;
                offset.y = e.clientY - wrapper.offsetTop;
                wrapper.style.zIndex = 1000;
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                wrapper.style.left = (e.clientX - offset.x) + 'px';
                wrapper.style.top = (e.clientY - offset.y) + 'px';
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
                wrapper.style.zIndex = 10;
            });
        });
    </script>
</body>
</html>
