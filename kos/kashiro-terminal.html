<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K-OS // TERMINAL</title>
    <link rel="stylesheet" href="/src/theme.css" />
    <style>
      .page { max-width: 1100px; }
      .term-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
      .term-col { display: grid; gap: 14px; }
      @media (max-width: 860px) { .term-grid { grid-template-columns: 1fr; } }
      .obs-link { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      .obs-link .field-label { margin-right: 4px; }
      .obs-link input { flex: 1; min-width: 180px; font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="page-head">
        <h1>💻 Terminal</h1>
        <p>Le virus Kashiro écrit sur ton overlay : messages en direct, archives et séquences.</p>
      </header>

      <section class="panel obs-link" aria-label="Lien OBS">
        <span class="field-label">Overlay OBS</span>
        <input id="link-overlay" readonly aria-label="Lien de l'overlay du terminal" />
        <button id="copy-overlay" class="btn-sm">Copier</button>
      </section>

      <div id="terminal-panel"></div>
    </main>
    <script type="module" src="/src/pages/kashiro-terminal.ts"></script>
  </body>
</html>
