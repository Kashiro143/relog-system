<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K-OS // SALONS</title>
    <link rel="stylesheet" href="/src/theme.css" />
    <style>
      body { padding: 12px; }
      [hidden] { display: none !important; }
      .wrap { display: grid; gap: 12px; max-width: 1500px; margin: 0 auto; }
      @media (min-width: 1000px) { .wrap { grid-template-columns: 260px minmax(0, 1fr); align-items: start; } .wrap > header { grid-column: 1 / -1; } }
      header h1 { margin: 0; font-size: 14px; font-weight: 400; letter-spacing: 3px; color: var(--accent-neon); padding-right: 260px; }
      .panel { padding: 14px; }
      .panel h4 { font-size: 11px; letter-spacing: 2px; margin-bottom: 10px; }
      .hint { font-size: 11px; color: var(--text-dim); margin: 8px 0 0; }

      /* Liste des salons */
      .create { display: flex; gap: 6px; margin-bottom: 12px; }
      .create input { flex: 1; min-width: 0; }
      .create button { flex: none; }
      .room-card { border: 1px solid var(--border); border-radius: 8px; padding: 10px; background: var(--panel-bg-alt); }
      .room-card + .room-card { margin-top: 8px; }
      .room-card.mine { border-color: var(--accent-neon); box-shadow: inset 3px 0 0 var(--accent-neon); }
      .room-card .top { display: flex; align-items: center; gap: 8px; }
      .room-card .name { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .room-card .people { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; min-height: 18px; }
      .person { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--c); color: var(--c); }
      .room-card .acts { display: flex; gap: 6px; }
      .room-card .acts button { padding: 5px 10px; font-size: 12px; }
      .room-card .join { background: var(--accent-neon); color: #000; border-color: var(--accent-neon); }
      .room-card .del { margin-left: auto; color: var(--status-offline); }
      .room-card .del.armed { background: var(--status-offline); color: #fff; }
      .empty { color: var(--text-dim); font-size: 12px; text-align: center; padding: 20px 8px; border: 1px dashed var(--border); border-radius: 8px; }

      /* Barre d'outils */
      .toolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 10px; }
      .group { display: inline-flex; gap: 2px; background: #000; border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
      .group button { border: 0; background: transparent; padding: 6px 10px; border-radius: 6px; color: var(--text-dim); font-size: 12px; }
      .group button:hover { color: var(--text-main); background: transparent; }
      .group button.on { background: var(--accent-low); color: var(--accent-neon); }
      .swatches { display: inline-flex; gap: 4px; }
      .swatch { width: 22px; height: 22px; border-radius: 50%; padding: 0; border: 2px solid transparent; background: var(--c); }
      .swatch.on { border-color: #fff; box-shadow: 0 0 0 2px #000 inset; }
      .actions { display: inline-flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
      .actions button { padding: 6px 10px; font-size: 12px; }
      .actions .armed { background: var(--status-offline); color: #fff; border-color: var(--status-offline); }

      /* Scène */
      .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; border: 1px solid var(--border);
        background: #07080a; background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
        background-size: calc(100% / 16) calc(100% / 9); touch-action: none; }
      .stage video.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0.85; }
      #view { position: absolute; inset: 0; }
      .capture { position: absolute; inset: 0; cursor: crosshair; }
      .capture.laser { cursor: none; }
      .capture.text { cursor: text; }
      .capture.off { pointer-events: none; }
      .text-input { position: absolute; transform: translate(-50%, -50%); min-width: 160px; font: 800 18px "Segoe UI", sans-serif; background: rgba(0,0,0,0.85); border: 1px dashed #fff; color: #fff; padding: 6px 8px; border-radius: 6px; z-index: 5; }
      .status-line { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-top: 8px; }
      .status-line .err { color: var(--status-offline); }
      .gif-panel { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); --gp-max: 240px; --gp-min: 96px; }
      .placeholder { color: var(--text-dim); text-align: center; padding: 80px 16px; border: 1px dashed var(--border); border-radius: 8px; }
      .placeholder b { color: var(--text-main); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header><h1>K-OS // SALONS RE:LOG</h1></header>

      <aside class="panel">
        <h4>Salons</h4>
        <form class="create" id="create-form">
          <input id="create-name" maxlength="40" placeholder="Nom du salon (ex : Débat du soir)" />
          <button type="submit">Créer</button>
        </form>
        <div id="rooms"></div>
        <p class="hint">Tout ce qui se passe dans un salon apparaît sur l'overlay Re:log de chaque participant. Quitter le salon le retire de ton stream.</p>
      </aside>

      <main class="panel">
        <div id="no-room" class="placeholder">
          <b>Tu n'es dans aucun salon.</b><br />Rejoins-en un ou crée le tien pour dessiner, écrire et poser des GIF sur le stream de tout le monde.
        </div>

        <div id="room-ui" hidden>
          <div class="toolbar">
            <div class="group" id="tools">
              <button data-tool="pen" title="Dessiner">✏️ Stylo</button>
              <button data-tool="laser" title="Pointer sans laisser de trace">◉ Laser</button>
              <button data-tool="text" title="Cliquer pour écrire">T Texte</button>
              <button data-tool="gif" title="Choisir un GIF puis cliquer pour le poser">🎞 GIF</button>
              <button data-tool="move" title="Déplacer ses textes et GIF, sélectionner pour supprimer">✥ Déplacer</button>
            </div>
            <div class="swatches" id="swatches"></div>
            <div class="group" id="sizes"><button data-size="0">S</button><button data-size="1">M</button><button data-size="2">L</button></div>
            <div class="group" id="fades" title="Durée avant disparition"><button data-fade="5">5 s</button><button data-fade="15">15 s</button><button data-fade="0">∞</button></div>
            <div class="actions">
              <button id="undo" title="Ctrl + Z">↶ Annuler</button>
              <button id="clear-mine">Effacer les miens</button>
              <button id="clear-all">Tout effacer</button>
              <button id="screen-bg" title="Ton écran n'est vu que par toi : il sert de repère pour dessiner">🖥 Mon écran en fond</button>
            </div>
          </div>

          <div class="stage" id="stage">
            <video class="bg" id="bg-video" muted autoplay playsinline hidden></video>
            <div id="view"></div>
            <div class="capture" id="capture"></div>
          </div>
          <div class="status-line"><span id="hint"></span><span id="error" class="err"></span></div>

          <div class="gif-panel" id="gif-panel" hidden><div id="picker"></div></div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/pages/room.ts"></script>
  </body>
</html>
