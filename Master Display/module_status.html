<!DOCTYPE html>
<html>
<head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');
        body { margin: 0; padding: 20px; color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        .bar-container { width: 300px; height: 4px; background: rgba(255,255,255,0.1); position: relative; }
        #progress { width: 45%; height: 100%; background: #0FF; transition: width 1s ease; box-shadow: 0 0 10px #0FF; }
        .label { font-size: 8px; letter-spacing: 3px; margin-bottom: 5px; opacity: 0.5; font-weight: 900; }
    </style>
</head>
<body>
    <div class="label">CORE_INTEGRITY // 45%</div>
    <div class="bar-container">
        <div id="progress"></div>
    </div>

    <script>
        // Ce module peut aussi écouter le Kernel pour faire monter la barre !
        window.addEventListener('storage', () => {
            const s = JSON.parse(localStorage.getItem('KOS_SIGNAL'));
            if(s.type === 'SIGNAL_UPGRADE') {
                document.getElementById('progress').style.width = "85%";
            }
        });
    </script>
</body>
</html>
