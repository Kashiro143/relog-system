<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>K-OS // OVERLAY_RELOG</title>
    <style>
      html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }
      #module-container { position: absolute; inset: 0; width: 100%; height: 100%; border: none; background: transparent; }
      /* Tout ce que les autres membres envoient : coupé d'un coup par le bouton panique. */
      #collective-layer { position: absolute; inset: 0; pointer-events: none; }
      #video-layer, #room-layer, #signal-layer, #gif-layer { position: absolute; inset: 0; }
    </style>
  </head>
  <body data-role="overlay">
    <iframe id="module-container" src="about:blank" allowtransparency="true"></iframe>
    <div id="collective-layer">
      <div id="video-layer"></div>
      <div id="room-layer"></div>
      <div id="signal-layer"></div>
      <div id="gif-layer"></div>
    </div>
    <script type="module" src="/src/pages/overlay.ts"></script>
  </body>
</html>
